services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatdata_langgraph_db
    environment:
      POSTGRES_DB: chatdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - chatdata_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chatdata_pg:
